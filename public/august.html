<meta charset="UTF-8">

<title>2026年8月销售工作任务分解器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f0f2f5;--card:#fff;--border:#e8e8e8;--text:#333;--text-sec:#666;
  --primary:#1890ff;--success:#52c41a;--warning:#faad14;--danger:#f5222d;
  --purple:#722ed1;--cyan:#13c2c2;--orange:#fa8c16;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);line-height:1.6}

/* Topbar */
.topbar{background:linear-gradient(135deg,#001529 0%,#003a70 100%);color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.topbar h1{font-size:20px;font-weight:600;letter-spacing:1px}
.topbar .sub{font-size:12px;opacity:.7;margin-top:2px}
.topbar .stats{display:flex;gap:24px}
.topbar .stat{text-align:center}
.topbar .stat .num{font-size:22px;font-weight:700;color:#faad14}
.topbar .stat .lbl{font-size:11px;opacity:.7}

/* Layout */
.layout{display:flex;max-width:1600px;margin:0 auto}
.sidebar{width:260px;background:var(--card);border-right:1px solid var(--border);padding:16px;position:sticky;top:73px;height:calc(100vh - 73px);overflow-y:auto;flex-shrink:0}
.sidebar h3{font-size:13px;color:var(--text-sec);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);padding-bottom:6px}
.sidebar .filter-group{margin-bottom:20px}
.sidebar label{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:14px;transition:background .2s}
.sidebar label:hover{background:#f5f5f5}
.sidebar input[type=checkbox],.sidebar input[type=radio]{accent-color:var(--primary)}
.sidebar .color-dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}
.main{flex:1;padding:20px 24px;min-width:0}

/* Cards */
.task-card{background:var(--card);border-radius:10px;padding:16px 20px;margin-bottom:12px;border-left:4px solid var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.06);transition:box-shadow .2s,transform .15s}
.task-card:hover{box-shadow:0 2px 12px rgba(0,0,0,.1);transform:translateY(-1px)}
.task-card .card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:8px}
.task-card .card-title{font-size:15px;font-weight:600;flex:1;min-width:0}
.task-card .card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500;white-space:nowrap}
.tag-person{color:#fff}
.tag-week{background:#e6f7ff;color:#1890ff;border:1px solid #91d5ff}
.tag-priority{font-weight:600}
.tag-priority.p1{background:#fff1f0;color:#f5222d;border:1px solid #ffa39e}
.tag-priority.p2{background:#fff7e6;color:#fa8c16;border:1px solid #ffd591}
.tag-priority.p3{background:#f6ffed;color:#52c41a;border:1px solid #b7eb8f}
.tag-cat{background:#f9f0ff;color:#722ed1;border:1px solid #d3adf7}
.task-card .card-body{font-size:13px;color:var(--text-sec);line-height:1.8}
.task-card .card-body .detail-item{padding:2px 0}
.task-card .card-body .detail-item::before{content:'▸ ';color:var(--primary)}
.task-card .card-target{display:inline-block;background:#f5f5f5;padding:2px 8px;border-radius:4px;font-size:12px;margin-top:6px;color:var(--text)}
.task-card .card-progress{margin-top:8px}
.task-card .progress-bar{height:6px;background:#f0f0f0;border-radius:3px;overflow:hidden}
.task-card .progress-fill{height:100%;border-radius:3px;transition:width .3s}

/* Level nesting */
.task-level{margin-left:0}
.sub-level{margin-left:20px;padding-left:16px;border-left:2px dashed var(--border);margin-top:8px}
.sub-task{background:#fafafa;border-radius:8px;padding:10px 14px;margin-bottom:8px;border-left:3px solid var(--border)}
.sub-task .sub-title{font-size:13px;font-weight:600;margin-bottom:4px}

/* Section headers */
.section-header{font-size:16px;font-weight:700;margin:24px 0 12px;padding:8px 0;border-bottom:2px solid var(--primary);display:flex;align-items:center;gap:8px}
.section-header .week-date{font-size:12px;font-weight:400;color:var(--text-sec);margin-left:8px}

/* Summary panel */
.summary-panel{background:var(--card);border-radius:10px;padding:20px;margin-bottom:20px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.summary-panel h2{font-size:16px;margin-bottom:12px;color:var(--text)}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.summary-item{text-align:center;padding:12px;border-radius:8px;background:#f5f7fa}
.summary-item .val{font-size:24px;font-weight:700}
.summary-item .lbl{font-size:11px;color:var(--text-sec);margin-top:4px}

/* Person overview cards */
.person-overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:24px}
.person-card{background:var(--card);border-radius:10px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);border-top:3px solid}
.person-card .pc-name{font-size:16px;font-weight:700;margin-bottom:8px}
.person-card .pc-targets{font-size:13px;color:var(--text-sec);line-height:1.8}
.person-card .pc-targets span{color:var(--text);font-weight:600}

/* Mobile sidebar toggle */
.sidebar-toggle{display:none;position:fixed;top:16px;left:12px;z-index:200;background:rgba(255,255,255,.95);border:none;border-radius:6px;width:40px;height:40px;font-size:20px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.sidebar-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:150}
.sidebar-close{display:none;position:absolute;top:8px;right:12px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-sec)}

/* Responsive */
@media(max-width:768px){
  .topbar{padding:12px 16px 12px 56px}
  .topbar .stats{display:none}
  .topbar h1{font-size:16px}
  .sidebar-toggle{display:block}
  .sidebar{position:fixed;top:0;left:0;height:100vh;width:280px;z-index:151;transform:translateX(-100%);transition:transform .3s ease;padding-top:48px}
  .sidebar.sidebar-open{transform:translateX(0)}
  .sidebar-overlay.show{display:block}
  .sidebar-close{display:block}
  .main{padding:12px 16px}
  .task-card{padding:12px 14px}
  .summary-grid{grid-template-columns:repeat(2,1fr)}
  .person-overview{grid-template-columns:1fr}
}
@media(max-width:480px){
  .topbar h1{font-size:14px}
  .topbar .sub{font-size:10px}
  .tag{font-size:10px;padding:1px 6px}
  .sub-level{margin-left:10px;padding-left:10px}
}
</style>

// ========== RENDER ==========
const state = {persons:new Set(PERSONS.map(p=>p.id)),weeks:new Set(WEEKS.map(w=>w.id)),cats:new Set(CATEGORIES.map(c=>c.id)),priority:'all',day:null};

function getPerson(id){return PERSONS.find(p=>p.id===id)}
function getWeek(id){return WEEKS.find(w=>w.id===id)}
function getCat(id){return CATEGORIES.find(c=>c.id===id)}

// Init filters
function initFilters(){
  const pf=document.getElementById('personFilters');
  PERSONS.forEach(p=>{
    const lbl=document.createElement('label');
    lbl.innerHTML=`<input type="checkbox" checked onchange="togglePerson('${p.id}',this.checked)"><span class="color-dot" style="background:${p.color}"></span>${p.name}`;
    pf.appendChild(lbl);
  });
  const wf=document.getElementById('weekFilters');
  WEEKS.forEach(w=>{
    const lbl=document.createElement('label');
    lbl.innerHTML=`<input type="checkbox" checked onchange="toggleWeek('${w.id}',this.checked)"><span class="color-dot" style="background:#1890ff"></span>${w.label} <span style="font-size:11px;color:#999">(${w.date})</span>`;
    wf.appendChild(lbl);
  });
  const cf=document.getElementById('categoryFilters');
  CATEGORIES.forEach(c=>{
    const lbl=document.createElement('label');
    lbl.innerHTML=`<input type="checkbox" checked onchange="toggleCat('${c.id}',this.checked)"><span class="color-dot" style="background:${c.color}"></span>${c.name}`;
    cf.appendChild(lbl);
  });
  const df=document.getElementById('dayFilters');
  for(let d=3;d<=31;d++){
    const isWeekday=[3,4,5,6,7,10,11,12,13,14,17,18,19,20,21,24,25,26,27,28,31].includes(d);
    if(!isWeekday)continue;
    const btn=document.createElement('button');
    btn.textContent=d;
    btn.style.cssText='padding:4px 8px;border:1px solid #d9d9d9;border-radius:4px;background:#fff;cursor:pointer;font-size:12px;';
    btn.onclick=function(){selectDay('+d+')};
    btn.dataset.day=d;
    df.appendChild(btn);
  }
}

function togglePerson(id,checked){
  if(checked)state.persons.add(id);else state.persons.delete(id);
  closeSidebarOnMobile();render();
}
function toggleWeek(id,checked){
  if(checked)state.weeks.add(id);else state.weeks.delete(id);
  closeSidebarOnMobile();render();
}
function toggleCat(id,checked){
  if(checked)state.cats.add(id);else state.cats.delete(id);
  closeSidebarOnMobile();render();
}
function filterPriority(p){
  state.priority=p;render();
}
function selectDay(d){
  state.day=state.day===d?null:d;
  document.querySelectorAll('#dayFilters button').forEach(b=>{
    b.style.background=b.dataset.day==String(state.day)?'#1890ff':'#fff';
    b.style.color=b.dataset.day==String(state.day)?'#fff':'#333';
  });
  render();
}

function taskVisible(t){
  if(!state.persons.has(t.person))return false;
  if(!state.weeks.has(t.week))return false;
  if(!state.cats.has(t.cat))return false;
  if(state.priority!=='all'&&t.priority!==state.priority)return false;
  if(state.day&&!t.days.includes(state.day))return false;
  return true;
}

function renderPersonOverview(){
  const c=document.getElementById('personOverview');
  c.innerHTML='';
  PERSONS.forEach(p=>{
    if(!state.persons.has(p.id))return;
    const div=document.createElement('div');
    div.className='person-card';
    div.style.borderTopColor=p.color;
    div.innerHTML=`
      <div class="pc-name" style="color:${p.color}">${p.name} <span style="font-size:12px;color:#999;font-weight:400">${p.role}</span></div>
      <div class="pc-targets">
        <div>📊 业绩目标：<span>${p.target}万</span></div>
        <div>💰 回款目标：<span>${p.payment>0?p.payment+'万':'—'}</span></div>
        <div>🚶 外出拜访：<span>${p.visit}家</span></div>
        ${p.trip>0?`<div>✈️ 出差：<span>${p.trip}次</span></div>`:''}
        <div style="margin-top:6px;font-size:12px;color:#999">${p.summary}</div>
        <div style="margin-top:4px;font-size:12px;color:#999">重点客户：${p.keyAccounts}</div>
      </div>`;
    c.appendChild(div);
  });
}

function render(){
  renderPersonOverview();
  const container=document.getElementById('taskContainer');
  container.innerHTML='';
  let totalShown=0;

  WEEKS.forEach(w=>{
    if(!state.weeks.has(w.id))return;
    const weekTasks=TASKS.filter(t=>t.week===w.id&&taskVisible(t));
    if(weekTasks.length===0)return;

    const sec=document.createElement('div');
    sec.className='section-header';
    sec.innerHTML=`${w.label} <span class="week-date">2026年8月${w.date}（周一至周五）</span>`;
    container.appendChild(sec);

    // Group by person within each week
    PERSONS.forEach(p=>{
      if(!state.persons.has(p.id))return;
      const personTasks=weekTasks.filter(t=>t.person===p.id);
      if(personTasks.length===0)return;

      const pDiv=document.createElement('div');
      pDiv.style.marginBottom='16px';
      pDiv.innerHTML=`<div style="font-size:14px;font-weight:600;color:${p.color};margin-bottom:8px;padding-left:4px;border-left:3px solid ${p.color}">● ${p.name}</div>`;

      personTasks.forEach(t=>{
        totalShown++;
        const cat=getCat(t.cat);
        const card=document.createElement('div');
        card.className='task-card';
        card.style.borderLeftColor=p.color;

        const dayStr=t.days.length>1?`8/${t.days[0]}-${t.days[t.days.length-1]}`:`8/${t.days[0]}`;
        const priorityText={p1:'P1 紧急',p2:'P2 重要',p3:'P3 常规'}[t.priority];

        card.innerHTML=`
          <div class="card-header">
            <div class="card-title">${t.title}</div>
            <div class="card-meta">
              <span class="tag tag-person" style="background:${p.color}">${p.name}</span>
              <span class="tag tag-week">${w.name} ${dayStr}</span>
              <span class="tag tag-cat">${cat.name}</span>
              <span class="tag tag-priority ${t.priority}">${priorityText}</span>
            </div>
          </div>
          <div class="card-body">
            ${t.detail.map(d=>`<div class="detail-item">${d}</div>`).join('')}
          </div>
          ${t.target?`<div class="card-target">🎯 ${t.target}</div>`:''}
        `;
        pDiv.appendChild(card);
      });
      container.appendChild(pDiv);
    });
  });

  if(totalShown===0){
    container.innerHTML='<div style="text-align:center;padding:60px 20px;color:#999;font-size:16px">没有匹配的任务，请调整筛选条件</div>';
  }
}

// Mobile sidebar
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('sidebar-open');
  document.getElementById('sidebarOverlay').classList.toggle('show');
}
function closeSidebarOnMobile(){
  if(window.innerWidth<=768){
    document.getElementById('sidebar').classList.remove('sidebar-open');
    document.getElementById('sidebarOverlay').classList.remove('show');
  }
}

// Init
initFilters();
render();
</script>
